name: Build docs and push to pages

on:
  workflow_run:
    workflows: ["Build and Push Docker"]
    branches: [main]
    types:
      - completed

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  build_and_push_docs:
    runs-on: ubuntu-latest
    container: docker:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bedrock Export
        run: |
          docker run --rm ghcr.io/pangoraw/bedrock:latest \
            --volume ./docs/:/vault/ bedrock export /vault \
              --output=/vault \
              --title="Bedrock Docs" \
              --root-url=bedrock
      - name: Push to Github pages
        uses: actions/upload-pages-artifact@v3.0
        with:
          path: ./docs/public/
      - name: Deploy pages
        uses: actions/deploy-pages@v4
