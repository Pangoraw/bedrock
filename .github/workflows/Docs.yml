name: Build docs and push to pages

on:
  workflow_run:
    workflows: ["Build and Push Docker"]
    branches: [main]
    types:
      - completed

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  build_and_push_docs:
    runs-on: ubuntu-latest
    container: ghcr.io/pangoraw/bedrock:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: bedrock export ./docs
      - name: Push to Github pages
        uses: actions/upload-pages-artifact@v3.0
        with:
          path: ./public/
      - name: Deploy pages
        uses: actions/deploy-pages@v4
